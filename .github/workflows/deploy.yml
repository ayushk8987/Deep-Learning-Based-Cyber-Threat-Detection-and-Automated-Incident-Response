name: CI/CD Pipeline - Cyber Threat Detection & Incident Response

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: cyber-soc-ids
  APP_NAME: cyber-soc-app

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Syntax & Lint Check
        run: |
          # Stop build on critical syntax errors
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,Documents
          # Style check with tolerance
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=venv,.venv,Documents

      - name: Run Test Suite
        env:
          PYTHONPATH: .
          FLASK_ENV: testing
        run: |
          pytest tests/ -v

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $REGISTRY/$ECR_REPOSITORY:latest .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    name: Deploy to Kubernetes Cluster (K3s)
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Rolling Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || '3.27.59.101' }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/cyber-soc/repo
            git pull origin main
            sudo /usr/local/bin/refresh-ecr-token.sh
            sudo kubectl apply -f /opt/cyber-soc/repo/k8s/pvc.yaml
            sudo kubectl apply -f /opt/cyber-soc/repo/k8s/configmap.yaml
            sudo kubectl apply -f /opt/cyber-soc/repo/k8s/secret.yaml
            sudo kubectl apply -f /opt/cyber-soc/repo/k8s/service.yaml
            sudo kubectl apply -f /opt/cyber-soc/repo/k8s/deployment.yaml
            sudo kubectl rollout restart deployment/cyber-soc-deployment -n cyber-soc
            sudo kubectl rollout status deployment/cyber-soc-deployment -n cyber-soc --timeout=180s
