# ==============================================================================
# DEPLOYMENT PREPARATION: Nginx Production Reverse Proxy Configuration
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip compression for web assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Upstream application server
    upstream flask_app {
        server 127.0.0.1:5050;
        keepalive 32;
    }

    server {
        listen 80;
        server_name [DOMAIN_NAME_PLACEHOLDER] localhost;

        # Maximum upload size for network capture CSVs
        client_max_body_size 100M;

        # Standard Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            proxy_pass http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Static assets caching
        location /static/ {
            alias /app/static/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # Healthcheck pass-through
        location /api/health {
            proxy_pass http://flask_app/api/health;
            access_log off;
        }
    }
}
