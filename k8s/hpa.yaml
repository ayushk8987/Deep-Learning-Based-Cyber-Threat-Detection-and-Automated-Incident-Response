apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cyber-soc-hpa
  namespace: cyber-soc
  labels:
    app.kubernetes.io/name: cyber-soc-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cyber-soc-deployment
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
