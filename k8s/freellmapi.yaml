# ==============================================================================
# Optional In-Cluster FreeLLMAPI Gateway Deployment & Service
# Use this if you want to run FreeLLMAPI directly inside your Kubernetes cluster.
# If you are already running FreeLLMAPI outside the cluster, simply update
# FREELLMAPI_BASE_URL in k8s/configmap.yaml with your external endpoint.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freellmapi-deployment
  namespace: cyber-soc
  labels:
    app.kubernetes.io/name: freellmapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: freellmapi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: freellmapi
    spec:
      containers:
        - name: freellmapi
          image: ghcr.io/tashfeenahmed/freellmapi:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: HOST
              value: "0.0.0.0"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: freellmapi-service
  namespace: cyber-soc
  labels:
    app.kubernetes.io/name: freellmapi
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: freellmapi
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
