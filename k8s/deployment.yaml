apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyber-soc-deployment
  namespace: cyber-soc
  labels:
    app.kubernetes.io/name: cyber-soc-app
    app.kubernetes.io/component: ids-soar-engine
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cyber-soc-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cyber-soc-app
        app.kubernetes.io/component: ids-soar-engine
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: cyber-soc-app
          image: 361879816440.dkr.ecr.ap-southeast-2.amazonaws.com/cyber-soc-ids:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5050
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cyber-soc-config
            - secretRef:
                name: cyber-soc-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1.5Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5050
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5050
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 2
          volumeMounts:
            - name: soc-storage
              mountPath: /app/data
      volumes:
        - name: soc-storage
          persistentVolumeClaim:
            claimName: cyber-soc-data-pvc
